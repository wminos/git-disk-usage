[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "git-disk-usage"
description = "Pretty TUI reporter for disk usage and tracked sizes across git repos"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"
dependencies = [
    "textual==0.86.0",
]

[project.scripts]
git-disk-usage = "git_disk_usage.main:main"
git-du = "git_disk_usage.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/git_disk_usage"]
